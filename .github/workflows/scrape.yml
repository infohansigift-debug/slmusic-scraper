name: Auto Scrape LiveHitzMP3

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4 lxml

      - run: python scraper.py

      - name: Commit & push
        run: |
          git config user.name "LiveHitz Bot"
          git config user.email "bot@toolkitfox.com"
          git add songs.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update songs"
            git push
          fi
